<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <title>Mediafile DNL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">▣</div>
      <div>
        <strong>Mediafile DNL</strong>
        <small>Almacenamiento privado</small>
      </div>
    </div>
    <button id="btnRefresh" class="icon-btn" title="Actualizar">↻</button>
  </header>

  <main>
    <section class="hero">
      <span class="eyebrow">PANEL PRINCIPAL</span>
      <h1>Bienvenido 👋</h1>
      <p>Administra fotos, videos y comprobantes desde un solo lugar.</p>
      <div id="connection" class="status status-wait">● Comprobando conexión...</div>
    </section>

    <section class="cards">
      <button class="card" data-filter="image">
        <span class="card-icon">🖼️</span><b>Fotos</b><small>Imágenes almacenadas</small>
      </button>
      <button class="card" data-filter="video">
        <span class="card-icon">🎬</span><b>Videos</b><small>Videos almacenados</small>
      </button>
      <button class="card" data-filter="receipt">
        <span class="card-icon">🧾</span><b>Comprobantes</b><small>Archivos de respaldo</small>
      </button>
      <button class="card" data-filter="all">
        <span class="card-icon">📁</span><b>Todos</b><small>Ver todos los archivos</small>
      </button>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <span class="eyebrow">ARCHIVOS</span>
          <h2 id="listTitle">Todos los archivos</h2>
        </div>
        <label class="upload-btn">
          ＋ Subir
          <input id="fileInput" type="file" multiple hidden>
        </label>
      </div>
      <div id="fileList" class="file-list">
        <div class="empty">Cargando archivos…</div>
      </div>
    </section>

    <section class="diagnostic">
      <div class="diagnostic-head">
        <b>Diagnóstico</b>
        <button id="btnClearLog">Limpiar</button>
      </div>
      <pre id="diagnosticLog">Iniciando Mediafile DNL…</pre>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="active">⌂<span>Inicio</span></button>
    <button id="navFiles">▣<span>Archivos</span></button>
    <button id="navGallery">▦<span>Galería</span></button>
    <button id="navConfig">⚙<span>Config.</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
